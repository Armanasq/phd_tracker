name: Bug report
description: Report a reproducible frontend, private-runtime, or data-validation defect.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private applicant records, email excerpts, passwords or other sensitive information. For security vulnerabilities, follow SECURITY.md."
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - GitHub Pages frontend
        - Local private AI runtime
        - Provider configuration
        - Evidence and verification
        - Source ingestion
        - CI and deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe the expected outcome.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed behavior and reproduction
      placeholder: List steps and sanitized error output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v0.1.0 or a short commit SHA
  - type: input
    id: browser
    attributes:
      label: Runtime, OS, or browser
      placeholder: e.g. Python 3.12 / Chromium / Linux
