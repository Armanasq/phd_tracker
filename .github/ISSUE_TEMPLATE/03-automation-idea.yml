name: Automation experiment
description: Propose an automation feature with measurable success, guardrails and real evidence.
title: "[Experiment] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Decision failure this feature addresses
      description: Describe the missed deadline, false eligibility decision, wasted review effort or other measurable failure.
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Proposed mechanism and trusted data sources
      description: Define inputs, outputs, permission boundaries, expected states and human confirmation.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Verification and acceptance criteria
      description: Include a success metric, error metric, adversarial case and rollback strategy.
    validations:
      required: true
  - type: dropdown
    id: maturity
    attributes:
      label: Current maturity
      options:
        - Concept
        - Evidence-backed prototype
        - Tested integration
        - Production candidate
    validations:
      required: true
