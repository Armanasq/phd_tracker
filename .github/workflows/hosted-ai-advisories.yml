name: PhD Atlas | Hosted AI Verification Triage

on:
  workflow_dispatch:
  schedule:
    - cron: '11 7 * * *'

permissions:
  contents: read

concurrency:
  group: phd-atlas-hosted-ai-${{ github.repository }}
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main' && vars.PHD_ATLAS_ENABLE_HOSTED_AI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: phd-atlas-ai
      deployment: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Assemble repository-owned public verification facts
        env:
          PHD_ATLAS_DATA_MODE: ${{ vars.PHD_ATLAS_DATA_MODE }}
        run: python scripts/build_workspace.py --out /tmp/phd-atlas-hosted-input.json
      - name: Generate bounded public-safe model proposals
        env:
          PHD_ATLAS_AI_API_KEY: ${{ secrets.PHD_ATLAS_AI_API_KEY }}
          PHD_ATLAS_AI_BASE_URL: ${{ vars.PHD_ATLAS_AI_BASE_URL }}
          PHD_ATLAS_AI_MODEL: ${{ vars.PHD_ATLAS_AI_MODEL }}
          PHD_ATLAS_AI_AUTH_MODE: ${{ vars.PHD_ATLAS_AI_AUTH_MODE }}
          PHD_ATLAS_AI_TOKEN_PARAMETER: ${{ vars.PHD_ATLAS_AI_TOKEN_PARAMETER }}
        run: |
          python scripts/hosted_ai_advisories.py --input /tmp/phd-atlas-hosted-input.json --output /tmp/hosted_ai_advisories.json
          python scripts/hosted_ai_advisories.py --input /tmp/phd-atlas-hosted-input.json --validate /tmp/hosted_ai_advisories.json
      - name: Upload only validated enumerated proposals
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-ai-proposals
          path: /tmp/hosted_ai_advisories.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hosted-ai-proposals
          path: /tmp/phd-hosted-output
      - name: Revalidate public-source provenance before publishing
        env:
          PHD_ATLAS_DATA_MODE: ${{ vars.PHD_ATLAS_DATA_MODE }}
        run: |
          set -euo pipefail
          python scripts/build_workspace.py --out /tmp/phd-atlas-hosted-recheck.json
          python scripts/hosted_ai_advisories.py --input /tmp/phd-atlas-hosted-recheck.json --validate /tmp/phd-hosted-output/hosted_ai_advisories.json
          cp /tmp/phd-hosted-output/hosted_ai_advisories.json data/hosted_ai_advisories.json
      - name: Commit validated public classifications only and republish Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hosted_ai_advisories.json
          if git diff --cached --quiet; then
            echo 'Hosted advisory is unchanged.'
            exit 0
          fi
          git commit -m 'Refresh unverified hosted AI proof-gap triage'
          git push origin HEAD:main
          gh workflow run publish-cockpit.yml --ref main
