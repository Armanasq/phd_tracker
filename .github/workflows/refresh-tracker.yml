name: Evidence-first PhD tracker refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-tracker.yml
      - scripts/**
      - data/opportunities.json
      - data/mail_signals.json
      - data/watchlist.json

permissions:
  contents: write

concurrency:
  group: phd-tracker-refresher
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out private tracker
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic workbook writer
        run: python -m pip install openpyxl==3.1.5
      - name: Import new Gmail metadata if OAuth was configured
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/gmail_intake.py
      - name: Verify official source anchors and refresh workbook
        run: python scripts/refresh_tracker.py --online
      - name: Verify integrity, provenance and deduplication
        run: python scripts/validate_tracker.py
      - name: Commit spreadsheet snapshot and safe intake metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PhD_Action_List.xlsx
          if [ -f data/mail_inbox.json ]; then
            git add data/mail_inbox.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh PhD application tracker with verified evidence"
            git push origin HEAD:main
          fi
