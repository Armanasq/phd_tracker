name: PhD Intelligence - Code Quality Gates

on:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - requirements-intelligence.txt
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phd-intelligence-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - run: python -m compileall -q scripts
      - run: python -m pytest tests -q
