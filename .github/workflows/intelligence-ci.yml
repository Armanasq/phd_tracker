name: PhD Intelligence - Code Quality Gates

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - scripts/**
      - data/user_opportunities.json
      - data/user_workspace_overrides.json
      - data/user_opportunities.example.json
      - tests/**
      - dashboard/**
      - site/**
      - phd_agents/**
      - requirements-intelligence.txt
      - .github/workflows/**
      - .github/README_TEMPLATE.md
      - README.md
      - CHANGELOG.md
      - VERSION
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - dashboard/**
      - site/**
      - phd_agents/**
      - requirements-intelligence.txt
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phd-intelligence-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - run: python -m compileall -q scripts phd_agents
      - run: node --check site/app.js
      - run: node --check site/modules/storage.mjs
      - run: node --test tests/storage.test.mjs
      - run: node --check site/modules/local-records.mjs
      - run: node --test tests/local_records.test.mjs
      - run: node --check site/modules/lens.mjs
      - run: node --check site/modules/console.mjs
      - run: node --check site/modules/operations.mjs
      - run: node --check site/modules/capacity-view.mjs
      - run: node --test tests/capacity_view.test.mjs
      - run: node --check site/modules/deadline-cutoff.mjs
      - run: node --test tests/deadline_cutoff.test.mjs
      - run: node --check site/modules/readiness.mjs
      - run: node --check site/modules/readiness-view.mjs
      - run: node --test tests/readiness.test.mjs tests/readiness_view.test.mjs
      - run: node --check site/modules/domain.mjs
      - run: node --check site/modules/assurance.mjs
      - run: node --check site/modules/assurance-view.mjs
      - run: node --test tests/assurance.test.mjs
      - run: test -s site/quiet.css
      - run: python -m pytest tests -q
      - run: python -m unittest discover -s tests -p 'test_instance_privacy.py'
      - name: Validate snapshot builder as deployed script
        run: |
          python scripts/build_workspace.py --out /tmp/phd-atlas-smoke.json
          python - <<'PY'
          import json
          from scripts.instance_config import resolve_data_mode, resolve_repository
          d = json.load(open("/tmp/phd-atlas-smoke.json", encoding="utf-8"))
          repository = resolve_repository()
          assert d["schema_version"] == 1
          assert d["instance"]["repository"] == repository
          assert d["instance"]["data_mode"] == resolve_data_mode(repository)
          assert isinstance(d["records"], list)
          assert d["meta"]["tracked"] == sum(row["record_type"] == "tracked" for row in d["records"])
          assert d["meta"]["candidates"] == sum(row["record_type"] == "candidate" for row in d["records"])
          if d["instance"]["data_mode"] == "starter":
              assert d["records"] == []
          PY
      - name: Render observatory against repository snapshots
        run: |
          python scripts/experience_engine.py
          python scripts/render_command_center.py
          test -s assets/readme/evidence_pipeline.gif
          test -s dashboard/index.html
          test -s data/experience_view.json
          test -s data/experience_lineage.jsonld
          test -s assets/readme/isometric_calendar.svg
          test -s data/readme_opportunities.geojson
          test -s docs/diagrams/pipeline.mmd
          test -s docs/diagrams/deadlines.mmd
          test -s assets/readme/deadline_skyline.stl
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('dashboard/template.html').read_text()
          script = re.findall(r'<script(?:\\s+[^>]*)?>(.*?)</script>', source, re.S)[-1]
          Path('/tmp/experience-dashboard.js').write_text(script)
          PY
          node --check /tmp/experience-dashboard.js
          node --check dashboard/experience.js
          node --check dashboard/visual_laboratory.js
      - name: Validate real interaction bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          template = Path('dashboard/template.html').read_text(encoding='utf-8')
          script = Path('dashboard/experience.js').read_text(encoding='utf-8')
          for token in ('id="chronos"', 'id="evidence-graph"', 'id="command-query"', 'id="priority-list"', 'id="lane-review"', 'src="experience.js"', 'href="experience.css"'):
              assert token in template, token
          for token in ('renderPriority', 'buildGraph', 'setHorizon', 'renderBoard', 'renderPalette', 'download('):
              assert token in script, token
          for token in ('id="lab-sankey"', 'id="lab-world"', 'id="lab-quadrant-viz"', 'id="lab-research-viz"', 'src="visual_laboratory.js"', 'href="visual_laboratory.css"'):
              assert token in template, token
          for asset in ('assets/readme/kinetic_cover.svg', 'assets/readme/kinetic_lane.svg'):
              assert Path(asset).is_file(), asset
          PY

