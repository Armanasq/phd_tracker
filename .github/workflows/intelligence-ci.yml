name: PhD Intelligence - Code Quality Gates

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - scripts/**
      - tests/**
      - dashboard/**
      - requirements-intelligence.txt
      - .github/workflows/**
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - dashboard/**
      - requirements-intelligence.txt
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phd-intelligence-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - run: python -m compileall -q scripts
      - run: python -m pytest tests -q
      - name: Render observatory against repository snapshots
        run: |
          python scripts/experience_engine.py
          python scripts/render_command_center.py
          test -s assets/readme/evidence_pipeline.gif
          test -s dashboard/index.html
          test -s data/experience_view.json
          test -s data/experience_lineage.jsonld
          test -s assets/readme/isometric_calendar.svg
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('dashboard/template.html').read_text()
          script = re.findall(r'<script(?:\\s+[^>]*)?>(.*?)</script>', source, re.S)[-1]
          Path('/tmp/experience-dashboard.js').write_text(script)
          PY
          node --check /tmp/experience-dashboard.js

  publish_preview:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/experiencegraph-cockpit'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - name: Render preview against committed evidence
        run: |
          python scripts/experience_engine.py
          python scripts/render_command_center.py
      - name: Commit preview assets to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/TODAY.md docs/EXPERIENCE.md dashboard/index.html data/experience_view.json data/experience_lineage.jsonld assets/readme/
          if git diff --cached --quiet; then
            echo "Preview already current"
          else
            git commit -m "Generate evidence-backed ExperienceGraph preview"
            git push origin HEAD:feature/experiencegraph-cockpit
          fi
