name: PhD Intelligence - Code Quality Gates

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - scripts/**
      - tests/**
      - dashboard/**
      - site/**
      - phd_agents/**
      - requirements-intelligence.txt
      - .github/workflows/**
  pull_request:
    paths:
      - scripts/**
      - tests/**
      - dashboard/**
      - site/**
      - phd_agents/**
      - requirements-intelligence.txt
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phd-intelligence-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - run: python -m compileall -q scripts phd_agents
      - run: node --check site/app.js
      - run: node --check site/modules/console.mjs
      - run: node --check site/modules/domain.mjs
      - run: python -m pytest tests -q
      - name: Validate snapshot builder as deployed script
        run: |
          python scripts/build_workspace.py --out /tmp/phd-atlas-smoke.json
          python -c 'import json; d=json.load(open("/tmp/phd-atlas-smoke.json")); assert d["schema_version"] == 1 and len(d["records"]) >= 109'
      - name: Render observatory against repository snapshots
        run: |
          python scripts/experience_engine.py
          python scripts/render_command_center.py
          test -s assets/readme/evidence_pipeline.gif
          test -s dashboard/index.html
          test -s data/experience_view.json
          test -s data/experience_lineage.jsonld
          test -s assets/readme/isometric_calendar.svg
          test -s data/readme_opportunities.geojson
          test -s docs/diagrams/pipeline.mmd
          test -s docs/diagrams/deadlines.mmd
          test -s assets/readme/deadline_skyline.stl
      - name: Validate dashboard JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path('dashboard/template.html').read_text()
          script = re.findall(r'<script(?:\\s+[^>]*)?>(.*?)</script>', source, re.S)[-1]
          Path('/tmp/experience-dashboard.js').write_text(script)
          PY
          node --check /tmp/experience-dashboard.js
          node --check dashboard/experience.js
          node --check dashboard/visual_laboratory.js
      - name: Validate real interaction bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          template = Path('dashboard/template.html').read_text(encoding='utf-8')
          script = Path('dashboard/experience.js').read_text(encoding='utf-8')
          for token in ('id="chronos"', 'id="evidence-graph"', 'id="command-query"', 'id="priority-list"', 'id="lane-review"', 'src="experience.js"', 'href="experience.css"'):
              assert token in template, token
          for token in ('renderPriority', 'buildGraph', 'setHorizon', 'renderBoard', 'renderPalette', 'download('):
              assert token in script, token
          for token in ('id="lab-sankey"', 'id="lab-world"', 'id="lab-quadrant-viz"', 'id="lab-research-viz"', 'src="visual_laboratory.js"', 'href="visual_laboratory.css"'):
              assert token in template, token
          for asset in ('assets/readme/kinetic_cover.svg', 'assets/readme/kinetic_lane.svg'):
              assert Path(asset).is_file(), asset
          PY

