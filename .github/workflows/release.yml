name: PhD Atlas | Publish Versioned Preview Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phd-atlas-versioned-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PHD_ATLAS_SITE_URL: ${{ vars.PHD_ATLAS_SITE_URL }}
      PHD_ATLAS_DATA_MODE: ${{ vars.PHD_ATLAS_DATA_MODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - name: Validate release identifier, notes, and application contracts
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -q "^## $version " CHANGELOG.md
          python scripts/instance_config.py --repository "$GITHUB_REPOSITORY" --site site --site-url "${PHD_ATLAS_SITE_URL:-}" --commit "$GITHUB_SHA"
          python -c 'import json,os; from pathlib import Path; c=json.loads(Path("site/instance.json").read_text()); assert c["repository"]==os.environ["GITHUB_REPOSITORY"]; assert c["site_url"] in Path("site/index.html").read_text()'
          test -s site/favicon.svg
          test -s site/sitemap.xml
          python -m pip install -r requirements-intelligence.txt
          python -m pytest tests -q
          node --check site/app.js
          node --check site/modules/lens.mjs
          node --check site/modules/storage.mjs
          node --check site/modules/local-records.mjs
          python scripts/build_workspace.py --out /tmp/atlas-release-workspace.json
          python -c 'import json,os; d=json.load(open("/tmp/atlas-release-workspace.json")); assert d["schema_version"] == 1; assert d["instance"]["repository"] == os.environ["GITHUB_REPOSITORY"]; assert d["instance"]["data_mode"] == (os.environ.get("PHD_ATLAS_DATA_MODE","").strip().lower() or ("source" if os.environ["GITHUB_REPOSITORY"].lower()=="armanasq/phd_tracker" else "starter"))'
      - name: Create immutable release reference if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(tr -d '\r\n' < VERSION)"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; not replacing it."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "PhD Atlas $tag | Public Preview" \
            --notes-file CHANGELOG.md \
            --prerelease
          gh release view "$tag" --repo "$GH_REPO" --json tagName,url,isPrerelease
