name: PhD Atlas | Publish Versioned Preview Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phd-atlas-versioned-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - name: Validate release identifier, notes, and application contracts
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -q "^## $version " CHANGELOG.md
          grep -q "https://armanasq.github.io/phd_tracker/" site/index.html
          test -s site/favicon.svg
          test -s site/sitemap.xml
          python -m pip install -r requirements-intelligence.txt
          python -m pytest tests -q
          node --check site/app.js
          node --check site/modules/lens.mjs
          python scripts/build_workspace.py --out /tmp/atlas-release-workspace.json
          python -c 'import json; d=json.load(open("/tmp/atlas-release-workspace.json")); assert d["schema_version"] == 1 and len(d["records"]) >= 109'
      - name: Create immutable release reference if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(tr -d '\r\n' < VERSION)"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; not replacing it."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "PhD Atlas $tag | Public Preview" \
            --notes-file CHANGELOG.md \
            --prerelease
          gh release view "$tag" --repo "$GH_REPO" --json tagName,url,isPrerelease
