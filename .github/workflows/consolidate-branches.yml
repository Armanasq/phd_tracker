name: PhD Atlas | Consolidate Merged Branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/consolidate-branches.yml
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.repository == 'Armanasq/phd_tracker' && github.event_name == 'push' && contains(github.event.head_commit.message, '[consolidate-branches]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed branch identities, pull requests and ancestry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r branch expected pr; do
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            test "$actual" = "$expected"
            merged_at="$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.merged_at')"
            test "$merged_at" != "null"
            git merge-base --is-ancestor "$expected" "$GITHUB_SHA"
            echo "Verified $branch at $expected and merged PR #$pr"
          done <<'BRANCHES'
          feature/experiencegraph-cockpit e2d116cfde6912a2eb4a4e1ddc41895a6bc41de5 2
          feature/atlas-context-backend c5b792c8d5f9b8fb68774a0e3a6e9ca1ff83f040 3
          chore/repository-release-polish 3d755b19ca40baa508f14deb2ca30b0f1f9bf3ed 4
          BRANCHES
      - name: Delete only confirmed merged legacy branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in feature/experiencegraph-cockpit feature/atlas-context-backend chore/repository-release-polish; do
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Deleted $branch"
          done
          remaining="$(gh api "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')"
          if [ "$remaining" != "main" ]; then
            echo "::error::Expected main as the only remaining branch; found: $remaining"
            exit 1
          fi
          echo "### Branch consolidation verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Only main remains. Release tags and merged PRs are preserved." >> "$GITHUB_STEP_SUMMARY"

  prune_merged_pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only the exact merged source branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PR_BRANCH" = "main" ]; then
            exit 0
          fi
          if ! actual="$(gh api "repos/$GH_REPO/git/ref/heads/$PR_BRANCH" --jq '.object.sha' 2>/dev/null)"; then
            echo "Branch already removed."
            exit 0
          fi
          if [ "$actual" != "$PR_HEAD_SHA" ]; then
            echo "::warning::Branch advanced after merge. Preserving it for manual review."
            exit 0
          fi
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$PR_BRANCH"
          echo "Removed merged branch $PR_BRANCH at $PR_HEAD_SHA"
