name: EvidenceGraph | Render Kinetic README

on:
  push:
    branches: [main]
    paths:
      - scripts/kinetic_readme.py
      - scripts/experience_engine.py
      - scripts/readme_studio.py
      - scripts/render_command_center.py
      - .github/README_TEMPLATE.md
      - scripts/render_command_center.py
      - dashboard/template.html
      - dashboard/experience.css
      - dashboard/experience.js
      - dashboard/visual_laboratory.css
      - dashboard/visual_laboratory.js
      - .github/workflows/readme-render.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidencegraph-readme-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - name: Publish regenerated motion assets and interactive dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            python scripts/experience_engine.py
            python scripts/render_command_center.py
            test -s assets/readme/kinetic_cover.svg
            test -s assets/readme/kinetic_lane.svg
            test -s dashboard/index.html
            test -s data/readme_opportunities.geojson
            test -s docs/diagrams/pipeline.mmd
            test -s assets/readme/deadline_skyline.stl
            git add README.md docs/TODAY.md docs/RESEARCH_REPORT.md docs/EXPERIENCE.md docs/diagrams/ dashboard/index.html \
              assets/readme/ data/experience_view.json data/experience_lineage.jsonld data/readme_opportunities.geojson
            if git diff --cached --quiet; then
              echo "Rendered state already current"
              exit 0
            fi
            git commit -m "Render kinetic evidence-driven README and interactive cockpit"
            if git push origin HEAD:main; then
              echo "Published to main on attempt $attempt"
              exit 0
            fi
          done
          echo "Could not publish after four concurrent-writer attempts" >&2
          exit 1
