name: EvidenceGraph | Browser Interaction and Visual QA

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - dashboard/**
      - site/**
      - scripts/build_workspace.py
      - tests/site_smoke.cjs
      - tests/ai_studio_smoke.cjs
      - tests/all_routes_audit.cjs
      - tests/mobile_layout_audit.cjs
      - tests/site_accessibility.cjs
      - tests/domain.test.mjs
      - tests/test_workspace.py
      - scripts/workspace_controls.py
      - scripts/experience_engine.py
      - scripts/readme_studio.py
      - tests/ui_smoke.cjs
      - .github/workflows/visual-qa.yml
  pull_request:
    paths:
      - dashboard/**
      - site/**
      - scripts/build_workspace.py
      - scripts/render_command_center.py
      - tests/**
      - .github/workflows/visual-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidencegraph-browser-visual-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - name: Install generation dependencies
        run: python -m pip install -r requirements-intelligence.txt
      - name: Regenerate testable standalone application
        run: |
          python scripts/experience_engine.py
          test -s dashboard/index.html
      - name: Install headless browser
        run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium
      - name: Exercise map, charts, timeline, simulation and command palette
        run: node tests/ui_smoke.cjs
      - name: Generate PhD Atlas evidence-backed Pages snapshot
        run: python scripts/build_workspace.py --out site/data/workspace.json
      - name: Validate independent application-domain rules
        run: |
          node --test tests/domain.test.mjs
          node --test tests/assurance.test.mjs
      - name: Exercise PhD Atlas across desktop and mobile
        run: node tests/site_smoke.cjs
      - name: Verify unified Settings and automatic local model routing
        run: node tests/ai_studio_smoke.cjs
      - name: Audit WCAG 2.2 A/AA across key views and dialogs
        run: node tests/site_accessibility.cjs
      - name: Audit responsive alignment, gutters, typography and overflow at six phone/tablet widths
        run: node tests/mobile_layout_audit.cjs
      - name: Audit all 18 unified workspace routes in public and private modes across four viewports
        run: node tests/all_routes_audit.cjs
      - name: Publish desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencegraph-responsive-ui
          path: artifacts/ui-qa/*
          if-no-files-found: ignore
          retention-days: 14
