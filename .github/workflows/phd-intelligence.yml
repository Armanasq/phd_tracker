name: PhD Intelligence - Discovery, Reconciliation, Notifications

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/phd-intelligence.yml
      - scripts/**
      - tests/**
      - requirements-intelligence.txt
  schedule:
    - cron: "23 4 * * *"
    - cron: "41 15 * * *"

permissions:
  contents: read

concurrency:
  group: phd-intelligence-pipeline
  cancel-in-progress: false

jobs:
  discover:
    name: Discover research via ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [inria, brave]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - name: Fetch and structure opportunities
        env:
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: |
          mkdir -p artifacts/discovery
          python scripts/discovery_engine.py collect \
            --source "${{ matrix.source }}" \
            --output "artifacts/discovery/${{ matrix.source }}.json"
      - name: Capture source evidence and error statuses
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phd-intel-${{ matrix.source }}
          path: artifacts/discovery/${{ matrix.source }}.json
          retention-days: 14

  research_radar:
    name: Emerging research radar (arXiv, never classified as a vacancy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Collect latest research publications at arXiv rate limits
        run: python scripts/research_radar.py crawl --output artifacts/research_radar.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phd-research-radar
          path: artifacts/research_radar.json
          retention-days: 14

  reconcile:
    needs: [discover, research_radar]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: phd-intel-*
          path: artifacts/discovery
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phd-research-radar
          path: artifacts
      - name: Validate, reconcile from current main, and push
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: bash scripts/atomic_intelligence.sh

  notify:
    needs: reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - name: Publish one private Action Center and optional external alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPRISE_URLS: ${{ secrets.APPRISE_URLS }}
        run: bash scripts/atomic_notify.sh
