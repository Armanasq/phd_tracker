name: PhD Atlas | Publish GitHub Pages Workspace

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/build_workspace.py
      - scripts/hosted_ai_advisories.py
      - tests/test_hosted_ai_advisories.py
      - tests/hosted_ai.test.mjs
      - data/hosted_ai_advisories.json
      - scripts/instance_config.py
      - site/modules/readiness.mjs
      - site/modules/readiness-view.mjs
      - tests/readiness.test.mjs
      - tests/readiness_view.test.mjs
      - tests/test_instance_config.py
      - tests/local_records.test.mjs
      - tests/local_records_smoke.cjs
      - docs/SELF_HOSTING.md
      - scripts/workspace_controls.py
      - tests/domain.test.mjs
      - tests/assurance.test.mjs
      - data/workbook_audit.json
      - tests/test_workspace.py
      - data/workspace_overrides.json
      - data/opportunities.json
      - data/user_opportunities.json
      - data/user_workspace_overrides.json
      - data/experience_view.json
      - data/portfolio_frontier.json
      - data/decision_queue.json
      - data/discovered_candidates.json
      - data/execution_plan.json
      - data/exclusion_memory.json
      - data/discovery_report.json
      - data/application_assets.json
      - .github/workflows/publish-cockpit.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidencegraph-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PHD_ATLAS_SITE_URL: ${{ vars.PHD_ATLAS_SITE_URL }}
      PHD_ATLAS_ACTION_ISSUE: ${{ vars.PHD_ATLAS_ACTION_ISSUE }}
      PHD_ATLAS_DATA_MODE: ${{ vars.PHD_ATLAS_DATA_MODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build versioned evidence projection and validate front end
        run: |
          python scripts/build_workspace.py --out site/data/workspace.json
          python -m unittest discover -s tests -p 'test_workspace.py'
          python -m unittest discover -s tests -p 'test_instance_config.py'
          python -m unittest discover -s tests -p 'test_deadline_cutoffs.py'
          node --check site/app.js
          node --check site/modules/deadline-cutoff.mjs
          node --test tests/deadline_cutoff.test.mjs
          node --check site/modules/readiness.mjs
          node --check site/modules/readiness-view.mjs
          node --test tests/readiness.test.mjs tests/readiness_view.test.mjs
          node --check site/modules/hosted-ai.mjs
          node --test tests/hosted_ai.test.mjs
          python -m unittest discover -s tests -p 'test_hosted_ai_advisories.py'
          node --check site/modules/storage.mjs
          node --test tests/storage.test.mjs
          node --check site/modules/local-records.mjs
          node --test tests/local_records.test.mjs
          node --check site/modules/lens.mjs
          node --check site/modules/console.mjs
          node --check site/modules/discovery.mjs
          node --check site/modules/runtime-capabilities.mjs
          node --test tests/discovery.test.mjs tests/runtime_capabilities.test.mjs
          node --check site/modules/documents.mjs
          node --test tests/documents.test.mjs
          node --check site/modules/routes.mjs
          node --test tests/routes.test.mjs
          node --check site/modules/browser-model.mjs
          node --test tests/browser_model.test.mjs tests/browser_model_integration.test.mjs tests/browser_model_streaming.test.mjs
          node --check site/modules/assurance.mjs
          node --check site/modules/assurance-view.mjs
          node --test tests/assurance.test.mjs
          test -s site/assurance.css
          test -s site/responsive.css
          python scripts/instance_config.py --site site --commit "$GITHUB_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.instance_config import pages_url, resolve_repository
          config = json.loads(Path("site/instance.json").read_text(encoding="utf-8"))
          repo = resolve_repository()
          assert config["repository"] == repo
          assert config["site_url"] == pages_url(repo, os.environ.get("PHD_ATLAS_SITE_URL"))
          assert config["source_commit"] == os.environ["GITHUB_SHA"]
          assert f'rev={os.environ["GITHUB_SHA"]}' in Path("site/index.html").read_text(encoding="utf-8")
          PY
          node --check site/modules/operations.mjs
          node --check site/modules/capacity-view.mjs
          node --test tests/capacity_view.test.mjs
          node --test tests/domain.test.mjs
          test -s site/modules/domain.mjs
          test -s site/index.html
          test -s site/favicon.svg
          test -s site/sitemap.xml
          test -s site/instance.json
          python -c 'import json; from pathlib import Path; c=json.loads(Path("site/instance.json").read_text()); assert c["site_url"] in Path("site/index.html").read_text()'
          test -s site/style.css
          test -s site/workspace-v2.css
          test -s site/quiet.css
          test -s site/modules/console.mjs
          mkdir -p site/evidencegraph
          cp dashboard/index.html site/evidencegraph/index.html
          test -s site/evidencegraph/index.html
      - name: Generate commit-bound release manifest
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("site")
          assets = ["index.html", "app.js", "assurance.css", "responsive.css", "modules/assurance.mjs", "modules/assurance-view.mjs", "modules/domain.mjs", "modules/storage.mjs", "modules/local-records.mjs", "modules/deadline-cutoff.mjs", "modules/hosted-ai.mjs", "modules/readiness.mjs", "modules/readiness-view.mjs", "modules/capacity-view.mjs", "data/workspace.json", "instance.json", "sitemap.xml"]
          digests = {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in assets}
          manifest = {"schema_version": 1, "commit": os.environ["GITHUB_SHA"], "sha256": digests}
          (root / "release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Save standalone site archive for offline review
        uses: actions/upload-artifact@v4
        with:
          name: phd-atlas-offline-site
          path: site
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy PhD Atlas workspace
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages assets and current source schema
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PUBLISHED_URL%/}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 15 "$base/?revision=$GITHUB_SHA" -o /tmp/phd-hosted-index.html &&
               grep -q 'type="module"' /tmp/phd-hosted-index.html &&
               grep -q 'rel="canonical"' /tmp/phd-hosted-index.html &&
               grep -Fq "responsive.css?rev=$GITHUB_SHA" /tmp/phd-hosted-index.html &&
               curl -fsSL --max-time 15 "$base/modules/domain.mjs?revision=$GITHUB_SHA" -o /tmp/phd-hosted-domain.mjs &&
               grep -q 'validateSnapshot' /tmp/phd-hosted-domain.mjs &&
               curl -fsSL --max-time 15 "$base/modules/storage.mjs?revision=$GITHUB_SHA" -o /tmp/phd-hosted-storage.mjs &&
               curl -fsSL --max-time 15 "$base/modules/local-records.mjs?revision=$GITHUB_SHA" -o /tmp/phd-hosted-local-records.mjs &&
               curl -fsSL --max-time 15 "$base/modules/deadline-cutoff.mjs?revision=$GITHUB_SHA" -o /tmp/phd-hosted-deadline-cutoff.mjs &&
               grep -q "calendarEvents" /tmp/phd-hosted-deadline-cutoff.mjs &&
               curl -fsSL --max-time 15 "$base/modules/readiness.mjs?revision=$GITHUB_SHA" -o /tmp/phd-hosted-readiness.mjs &&
               grep -q "portfolioReadiness" /tmp/phd-hosted-readiness.mjs &&
               curl -fsSL --max-time 15 "$base/modules/readiness-view.mjs?revision=$GITHUB_SHA" -o /tmp/phd-hosted-readiness-view.mjs &&
               curl -fsSL --max-time 15 "$base/modules/capacity-view.mjs?revision=$GITHUB_SHA" -o /tmp/phd-hosted-capacity-view.mjs &&
               curl -fsSL --max-time 15 "$base/modules/assurance.mjs?revision=$GITHUB_SHA" -o /tmp/phd-hosted-assurance.mjs &&
               curl -fsSL --max-time 15 "$base/responsive.css?revision=$GITHUB_SHA" -o /tmp/phd-hosted-responsive.css &&
               curl -fsSL --max-time 15 "$base/release-manifest.json?revision=$GITHUB_SHA" -o /tmp/phd-hosted-manifest.json &&
               python -c 'import hashlib,json,os; m=json.load(open("/tmp/phd-hosted-manifest.json")); assert m["commit"]==os.environ["GITHUB_SHA"]; assert hashlib.sha256(open("/tmp/phd-hosted-assurance.mjs","rb").read()).hexdigest()==m["sha256"]["modules/assurance.mjs"]; assert hashlib.sha256(open("/tmp/phd-hosted-responsive.css","rb").read()).hexdigest()==m["sha256"]["responsive.css"]; assert hashlib.sha256(open("/tmp/phd-hosted-storage.mjs","rb").read()).hexdigest()==m["sha256"]["modules/storage.mjs"]; assert hashlib.sha256(open("/tmp/phd-hosted-local-records.mjs","rb").read()).hexdigest()==m["sha256"]["modules/local-records.mjs"]; assert hashlib.sha256(open("/tmp/phd-hosted-deadline-cutoff.mjs","rb").read()).hexdigest()==m["sha256"]["modules/deadline-cutoff.mjs"]; assert hashlib.sha256(open("/tmp/phd-hosted-readiness.mjs","rb").read()).hexdigest()==m["sha256"]["modules/readiness.mjs"]; assert hashlib.sha256(open("/tmp/phd-hosted-readiness-view.mjs","rb").read()).hexdigest()==m["sha256"]["modules/readiness-view.mjs"]; assert hashlib.sha256(open("/tmp/phd-hosted-capacity-view.mjs","rb").read()).hexdigest()==m["sha256"]["modules/capacity-view.mjs"]' &&
               curl -fsSL --max-time 15 "$base/favicon.svg?revision=$GITHUB_SHA" -o /tmp/phd-hosted-icon.svg &&
               grep -q '<svg' /tmp/phd-hosted-icon.svg &&
               curl -fsSL --max-time 15 "$base/sitemap.xml?revision=$GITHUB_SHA" -o /tmp/phd-hosted-sitemap.xml &&
               curl -fsSL --max-time 15 "$base/instance.json?revision=$GITHUB_SHA" -o /tmp/phd-hosted-instance.json &&
               python -c 'import json,os; from pathlib import Path; c=json.load(open("/tmp/phd-hosted-instance.json")); assert c["repository"]==os.environ["GITHUB_REPOSITORY"]; assert c["source_commit"]==os.environ["GITHUB_SHA"]; assert c["site_url"] in Path("/tmp/phd-hosted-sitemap.xml").read_text()' &&
               curl -fsSL --max-time 15 "$base/data/workspace.json?revision=$GITHUB_SHA" -o /tmp/phd-hosted-data.json &&
               python -c 'import json,os; d=json.load(open("/tmp/phd-hosted-data.json")); assert d["schema_version"] == 1 and d["instance"]["repository"] == os.environ["GITHUB_REPOSITORY"]; assert d["instance"]["data_mode"] == (os.environ.get("PHD_ATLAS_DATA_MODE","").strip().lower() or ("source" if os.environ["GITHUB_REPOSITORY"].lower()=="armanasq/phd_tracker" else "starter")); assert isinstance(d["records"],list)'; then
              echo "Confirmed deployed HTML, JavaScript module and repository-owned source snapshot at $base"
              exit 0
            fi
            sleep 5
          done
          echo "Published application verification failed" >&2
          exit 1
