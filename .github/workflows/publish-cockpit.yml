name: PhD Atlas | Publish GitHub Pages Workspace

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/build_workspace.py
      - scripts/workspace_controls.py
      - tests/domain.test.mjs
      - tests/test_workspace.py
      - data/workspace_overrides.json
      - data/opportunities.json
      - data/experience_view.json
      - data/portfolio_frontier.json
      - data/decision_queue.json
      - data/discovered_candidates.json
      - data/execution_plan.json
      - data/exclusion_memory.json
      - data/discovery_report.json
      - data/application_assets.json
      - .github/workflows/publish-cockpit.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidencegraph-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build versioned evidence projection and validate front end
        run: |
          python scripts/build_workspace.py --out site/data/workspace.json
          python -m unittest discover -s tests -p 'test_workspace.py'
          node --check site/app.js
          node --check site/modules/lens.mjs
          node --check site/modules/console.mjs
          node --check site/modules/operations.mjs
          node --test tests/domain.test.mjs
          test -s site/modules/domain.mjs
          test -s site/index.html
          test -s site/style.css
          test -s site/workspace-v2.css
          test -s site/quiet.css
          test -s site/modules/console.mjs
          mkdir -p site/evidencegraph
          cp dashboard/index.html site/evidencegraph/index.html
          test -s site/evidencegraph/index.html
      - name: Save standalone site archive for offline review
        uses: actions/upload-artifact@v4
        with:
          name: phd-atlas-offline-site
          path: site
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy PhD Atlas workspace
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Pages assets and current source schema
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PUBLISHED_URL%/}"
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL --max-time 15 "$base/?revision=$GITHUB_SHA" -o /tmp/phd-hosted-index.html &&
               grep -q 'type="module"' /tmp/phd-hosted-index.html &&
               curl -fsSL --max-time 15 "$base/modules/domain.mjs?revision=$GITHUB_SHA" -o /tmp/phd-hosted-domain.mjs &&
               grep -q 'validateSnapshot' /tmp/phd-hosted-domain.mjs &&
               curl -fsSL --max-time 15 "$base/data/workspace.json?revision=$GITHUB_SHA" -o /tmp/phd-hosted-data.json &&
               python -c 'import json; d=json.load(open("/tmp/phd-hosted-data.json")); assert d["schema_version"] == 1 and len(d["records"]) >= 109'; then
              echo "Confirmed deployed HTML, JavaScript module and 109+ authoritative source records at $base"
              exit 0
            fi
            sleep 5
          done
          echo "Published application verification failed" >&2
          exit 1
