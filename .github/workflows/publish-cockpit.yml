name: EvidenceGraph | Publish Interactive Cockpit

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidencegraph-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: {{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-intelligence.txt
      - run: python -m pip install -r requirements-intelligence.txt
      - name: Build standalone interactive application
        run: |
          python scripts/experience_engine.py
          mkdir -p site
          cp dashboard/index.html site/index.html
          test -s site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy hosted cockpit
        id: deployment
        uses: actions/deploy-pages@v4
