name: PhD Workbook - Full Data Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-workbook.yml
      - scripts/audit_workbook.py

permissions:
  contents: write

concurrency:
  group: phd-workbook-audit
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl==3.1.5
      - name: Inspect all tabs and upcoming deadlines
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit_workbook.py --as-of 2026-11-06
            git add data/workbook_audit.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Audit full PhD tracker workbook across every worksheet"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
