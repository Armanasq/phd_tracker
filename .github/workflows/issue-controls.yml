name: PhD Intelligence - Private Issue Controls

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: phd-intelligence-controls
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.comment.user.login == github.repository_owner && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl==3.1.5
      - name: Verify command, update preferences, acknowledge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bash scripts/atomic_controls.sh
