name: PhD Intelligence - Private Issue Controls

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: phd-intelligence-controls
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.comment.user.login == github.repository_owner && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl==3.1.5
      - name: Verify command, update preferences, acknowledge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bash scripts/atomic_controls.sh
