<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafbfa">
<meta name="description" content="Fall 2027 PhD application tracker: verified sources, deadlines and decisions.">
<title>PhD Atlas — Applications, Fall 2027</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./workspace-v2.css">
<link rel="stylesheet" href="./lens.css">
<link rel="stylesheet" href="./quiet.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app" class="shell">
  <aside class="sidebar" aria-label="Workspace navigation">
    
    <div class="brand" aria-label="PhD Atlas">
      <span class="brand-mark" aria-hidden="true">a<span>.</span></span>
      <span class="brand-name"><strong>atlas</strong><small>PhD applications · 2027</small></span>
    </div>
    
    <nav id="navigation" aria-label="Workspace views"></nav>
    <div class="mobile-workspace-navigation"><label for="workspaceSection">Workspace section</label><select id="workspaceSection" aria-label="Workspace section"></select></div>
    <section id="sidebarDue" class="sidebar-deadline" aria-label="Nearest recorded application closing"></section>
    <div class="side-bottom">
      <div class="side-caption">Source data</div>
      <div id="providerStatus" class="source-status" aria-live="polite">Reading source snapshot…</div>
      <div class="side-caption">AI connection</div><div id="aiRuntimeState" class="source-status" role="status">Checking private AI runtime…</div>
      <a class="side-link" href="https://github.com/Armanasq/phd_tracker" target="_blank" rel="noopener noreferrer">Source repository <span aria-hidden="true">↗</span></a>
    </div>
  </aside>
  <main id="main" class="main">
    <header class="topbar">
      <div class="crumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="crumbName">Overview</strong></div>
      <div class="top-actions">
        <button id="openSearch" class="top-search" type="button" aria-label="Find an application ⌘ K">
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 4.4 4.4"/></svg>
          <span>Find an application</span><kbd>⌘ K</kbd>
        </button>
        <button class="model-route" type="button" data-action="nav" data-value="settings" aria-label="Open model and agent settings"><span class="model-route-dot"></span><span id="currentModel">Connect model</span></button>
        <button class="btn primary top-copilot" type="button" data-action="lens-open">Ask Atlas</button>
        <span class="topbar-rule" aria-hidden="true"></span>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch color theme" title="Switch color theme">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.2m0 16.6v2.2m10.5-10.5h-2.2m-16.6 0H1.5M4.4 4.4 6 6m12 12 1.6 1.6m0-15.2L18 6M6 18l-1.6 1.6"/></svg>
        </button>
        <button id="notificationToggle" class="icon-btn" type="button" aria-label="Reminder preferences" title="Reminder preferences">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4"/></svg>
        </button>
        <button id="exportMenu" class="btn secondary export-btn" type="button">Export <span aria-hidden="true">↓</span></button>
      </div>
    </header>
    <div class="context-strip" aria-label="Source context"><span id="topEvidenceAsOf">Reading committed evidence…</span></div>
    <div id="body" class="page" aria-live="off"></div>
    <footer class="main-footer"><span>Atlas · PhD applications 2027</span><span>Recorded evidence is not proof of eligibility or submission.</span></footer>
  </main>
</div>
<div id="dialogRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
