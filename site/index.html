<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1323">
<meta name="description" content="Evidence-based Fall 2027 PhD application operations workspace">
<title>PhD Atlas — Fall 2027</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div id="app" class="shell">
<aside class="sidebar" aria-label="Primary navigation">
<div class="brand"><span class="brand-mark">◈</span><span><strong>PhD Atlas</strong><small>Fall 2027 · Evidence workspace</small></span></div>
<div class="nav-group-label">WORKSPACE</div>
<nav id="navigation" aria-label="Workspace views"></nav>
<div class="side-bottom">
<div id="providerStatus" class="source-status">Loading source evidence…</div>
<a class="side-link" href="https://github.com/Armanasq/phd_tracker" target="_blank" rel="noopener noreferrer">Repository ↗</a>
</div>
</aside>
<main id="main" class="main">
<header class="topbar">
<div class="crumb">PhD Atlas <span>/</span> <strong id="crumbName">Dashboard</strong></div>
<div class="top-actions">
<button id="openSearch" class="top-search" type="button" aria-label="Search workspace">⌕ <span>Search opportunities, faculty, evidence</span><kbd>⌘ K</kbd></button>
<button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme" title="Toggle theme">◐</button>
<button id="notificationToggle" class="icon-btn" type="button" aria-label="Enable on-page notifications" title="Configure reminders">♧</button>
<button id="exportMenu" class="btn secondary" type="button">Export ↓</button>
</div>
</header>
<div id="body" class="page"></div>
</main>
</div>
<div id="dialogRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./app.js" defer></script>
</body>
</html>
