<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="293" viewBox="0 0 1600 293" role="img" aria-label="Animated verified research to decision signal pipeline"><title>Animated verified research to decision signal pipeline</title><style>
    @keyframes tracer{to{stroke-dashoffset:-200}}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @keyframes breathe{0%,100%{opacity:.36}50%{opacity:.83}}
    @keyframes rise{0%{opacity:0;transform:translateY(8px)}50%,100%{opacity:1;transform:translateY(0)}}
    @keyframes march{to{transform:translateX(42px)}}
    @keyframes orbit{to{transform:rotate(-360deg)}}
    .dash{stroke-dasharray:7 14;animation:tracer 10s linear infinite}
    .ring{animation:rotate 45s linear infinite;transform-origin:1232px 328px}
    .counterring{animation:orbit 65s linear infinite;transform-origin:1232px 328px}
    .glow{animation:breathe 3s ease-in-out infinite}
    .enter{animation:rise 1s ease-out both}
    .march{animation:march 5s linear infinite}
    @media(prefers-reduced-motion:reduce){.dash,.ring,.counterring,.glow,.enter,.march{animation:none!important}}
    </style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061727"/><stop offset=".48" stop-color="#070E21"/><stop offset="1" stop-color="#0D1B2B"/></linearGradient><linearGradient id="beam"><stop stop-color="#6FF4CD" stop-opacity=".1"/><stop offset=".5" stop-color="#6FF4CD" stop-opacity=".8"/><stop offset="1" stop-color="#8EAAFF" stop-opacity=".14"/></linearGradient><radialGradient id="orb"><stop stop-color="#1F7478" stop-opacity=".52"/><stop offset=".55" stop-color="#10444D" stop-opacity=".18"/><stop offset="1" stop-color="#08152A" stop-opacity="0"/></radialGradient><filter id="bloom" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5"/></filter></defs><rect width="1600" height="293" fill="url(#bg)"/><path d="M 60 158 L 1540 158" stroke="#2B5266" stroke-width="1.8"/><text x="63.0" y="66.0" fill="#E8FAF7" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750" letter-spacing="2">RESEARCH SIGNAL PIPELINE</text><text x="63.0" y="102.0" fill="#9DBECA" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" letter-spacing="0">The motion follows a real source-to-decision pipeline, not a simulated application success rate</text><circle cx="90" cy="158" r="18" fill="#081A2C" stroke="#6FF4CD" stroke-width="2"/><circle cx="90" cy="158" r="4" fill="#6FF4CD" class="glow"/><text x="70.0" y="208.0" fill="#6FF4CD" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1">SOURCE DISCOVERY</text><text x="70.0" y="246.0" fill="#E8FAF7" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="0">1/4 healthy</text><circle cx="467" cy="158" r="18" fill="#081A2C" stroke="#FEC58B" stroke-width="2"/><circle cx="467" cy="158" r="4" fill="#FEC58B" class="glow"/><text x="447.0" y="208.0" fill="#FEC58B" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1">VERIFY ASSERTIONS</text><text x="447.0" y="246.0" fill="#E8FAF7" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="0">1 conflicting</text><circle cx="844" cy="158" r="18" fill="#081A2C" stroke="#8EAAFF" stroke-width="2"/><circle cx="844" cy="158" r="4" fill="#8EAAFF" class="glow"/><text x="824.0" y="208.0" fill="#8EAAFF" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1">RECONCILE IDENTITIES</text><text x="824.0" y="246.0" fill="#E8FAF7" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="0">108 tracked</text><circle cx="1221" cy="158" r="18" fill="#081A2C" stroke="#6FF4CD" stroke-width="2"/><circle cx="1221" cy="158" r="4" fill="#6FF4CD" class="glow"/><text x="1201.0" y="208.0" fill="#6FF4CD" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1">EXECUTE DECISIONS</text><text x="1201.0" y="246.0" fill="#E8FAF7" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="0">19 ≤7d</text><circle r="5" fill="#6FF4CD"><animateMotion dur="7s" repeatCount="indefinite" path="M 90 158 L 1221 158 L 1500 158"/></circle><circle r="3.5" fill="#FFD3A3"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite" path="M 90 158 L 1500 158"/></circle></svg>
